  cd:
    name: CD — Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev \
            --quiet
          echo "✅ Docker configured!"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .
          echo "✅ Docker image built!"

      - name: Push to Artifact Registry
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest
          echo "✅ Image pushed!"

      # ── Step 1: Deploy new revision with NO traffic ──────
      - name: Deploy new revision (no traffic)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --platform=managed \
            --allow-unauthenticated \
            --service-account=cloud-run-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:employee-api-db \
            --set-secrets=DATABASE_URL=employee-api-db-url:latest \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --port=8080 \
            --tag=v2 \
            --no-traffic \
            --quiet
          echo "✅ New revision deployed with 0% traffic!"

      # ── Step 2: Health check new revision ───────────────
      - name: Health check new revision
        run: |
          sleep 15
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(status.url)")

          echo "🔍 Checking new revision health..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $URL/health)

          if [ $RESPONSE -eq 200 ]; then
            echo "✅ Health check passed — safe to proceed!"
          else
            echo "❌ Health check failed — aborting deployment!"
            exit 1
          fi

      # ── Step 3: Canary — 20% traffic ────────────────────
      - name: Canary — shift 20% traffic to v2
        run: |
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --to-tags=v2=20 \
            --quiet
          echo "✅ 20% traffic shifted to v2!"

      # ── Step 4: Monitor at 20% ───────────────────────────
      - name: Monitor at 20% traffic
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(status.url)")

          echo "🔍 Running 5 health checks at 20% traffic..."
          FAILURES=0

          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $URL/health)
            if [ $RESPONSE -ne 200 ]; then
              FAILURES=$((FAILURES + 1))
              echo "⚠️ Check $i failed with status: $RESPONSE"
            else
              echo "✅ Check $i passed!"
            fi
            sleep 3
          done

          if [ $FAILURES -gt 1 ]; then
            echo "❌ Too many failures — rolling back to v1!"
            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --region=${{ env.REGION }} \
              --project=${{ env.PROJECT_ID }} \
              --to-tags=v2=0 \
              --quiet
            exit 1
          fi
          echo "✅ Monitoring passed at 20%!"

      # ── Step 5: Canary — 50% traffic ────────────────────
      - name: Canary — shift 50% traffic to v2
        run: |
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --to-tags=v2=50 \
            --quiet
          echo "✅ 50% traffic shifted to v2!"

      # ── Step 6: Monitor at 50% ───────────────────────────
      - name: Monitor at 50% traffic
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(status.url)")

          echo "🔍 Running 5 health checks at 50% traffic..."
          FAILURES=0

          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $URL/health)
            if [ $RESPONSE -ne 200 ]; then
              FAILURES=$((FAILURES + 1))
              echo "⚠️ Check $i failed with status: $RESPONSE"
            else
              echo "✅ Check $i passed!"
            fi
            sleep 3
          done

          if [ $FAILURES -gt 1 ]; then
            echo "❌ Too many failures — rolling back to v1!"
            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --region=${{ env.REGION }} \
              --project=${{ env.PROJECT_ID }} \
              --to-tags=v2=0 \
              --quiet
            exit 1
          fi
          echo "✅ Monitoring passed at 50%!"

      # ── Step 7: Promote to 100% ──────────────────────────
      - name: Promote — shift 100% traffic to v2
        run: |
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --to-tags=v2=100 \
            --quiet
          echo "✅ 100% traffic on new version!"

      # ── Step 8: Final health check ───────────────────────
      - name: Final health check
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          sleep 10

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $URL/health)

          if [ $RESPONSE -eq 200 ]; then
            echo "✅ Final health check passed!"
          else
            echo "❌ Final health check failed — rolling back!"
            gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
              --region=${{ env.REGION }} \
              --project=${{ env.PROJECT_ID }} \
              --to-tags=v2=0 \
              --quiet
            exit 1
          fi

      # ── Step 9: Deployment Summary ───────────────────────
      - name: Deployment Summary
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "════════════════════════════════════"
          echo "✅ ZERO DOWNTIME DEPLOYMENT COMPLETE!"
          echo "════════════════════════════════════"
          echo "🌍 Service URL:     $URL"
          echo "📦 Image:           ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "🌿 Branch:          ${{ github.ref_name }}"
          echo "👤 Deployed by:     ${{ github.actor }}"
          echo "🚦 Strategy:        Canary (0→20→50→100%)"
          echo "════════════════════════════════════"